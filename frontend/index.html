<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0a09" />
    <meta name="color-scheme" content="dark light" />
    <!-- Resolve the theme before first paint to avoid a dark/light flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("keystroke_auth_theme");
          var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "dark";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "light" ? "#f0eee9" : "#0d0a09");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e8622c'/%3E%3Cstop offset='1' stop-color='%23ff9a62'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='%230d0a09'/%3E%3Cpath d='M12 54h16l8-22 12 40 10-52 10 34h20' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Keystroke Dynamics — Biometric Authentication Engine</title>
    <meta
      name="description"
      content="Behavioral biometric authentication that recognises you by the rhythm of your typing, with real-time machine-learning classification."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
